plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = 'structure_gel' }

// Minecraft 1.21.1 requires Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // NeoForge CDN mirror first for reliable access from CN networks.
    maven { url 'https://neoforged.forgecdn.net/releases' }
    mavenCentral()
    maven { url 'https://maven.creeperhost.net/' }
}

neoForge {
    version = project.neo_version

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    // NeoForge 20.2.84+ ships MixinExtras at runtime; declare it for compilation only.
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Collect every porting diagnostic in one pass.
    options.compilerArgs += ['-Xmaxerrs', '50000']
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
