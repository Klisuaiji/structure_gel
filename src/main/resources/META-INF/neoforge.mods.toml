modLoader="javafml"
loaderVersion="${loader_version_range}"
license="https://www.gnu.org/licenses/gpl-3.0.en.html"
issueTrackerURL="https://github.com/Klisuaiji/structure_gel/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''An API mod to improve the developer side of structure gen.'''
logoFile="banner.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="structure_gel.mixins.json"

[modproperties.${mod_id}]
catalogueImageIcon="logo.png"
